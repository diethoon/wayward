name: Audit uploaded mods ZIP

on:
  push:
    branches:
      - audit/mods-zip-runtime-20261109
    paths:
      - ".github/workflows/audit-mods-zip-runtime.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect archive and extract only relevant mod sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, re, zipfile
          from pathlib import Path

          archive = Path("mods.zip")
          assert archive.is_file(), "mods.zip missing from checked-out commit"
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          out = Path("audit-output")
          out.mkdir(exist_ok=True)
          patterns = re.compile(
              r"image.?search|search.?image|이미지.?서치|이미지.?검색|"
              r"서치.?커스터마이즈|imageSearch|SearchCustomize",
              re.I
          )
          content_terms = [
              "이미지서치커스터마이즈", "이미지 서치 커스터마이즈",
              "imageSearchCustomize", "image-search-customize",
              "imageSearch", "searchCustomize"
          ]
          with zipfile.ZipFile(archive) as zf:
              infos = [i for i in zf.infolist() if not i.is_dir()]
              print("ARCHIVE_META", json.dumps({
                  "bytes": archive.stat().st_size,
                  "sha256": digest,
                  "entries": len(infos),
                  "uncompressed_bytes": sum(i.file_size for i in infos)
              }, ensure_ascii=False))
              matches, package_files, content_matches = set(), [], []
              for info in infos:
                  p = info.filename.replace("\\", "/")
                  if patterns.search(p):
                      matches.add(p)
                  if p.lower().endswith("package.json") or p.endswith("src/cli.ts"):
                      package_files.append(p)
                  if p.lower().endswith((".js", ".mjs", ".cjs", ".json", ".ts")) and info.file_size <= 5 * 1024 * 1024:
                      try:
                          data = zf.read(info).decode("utf-8", "replace")
                      except Exception:
                          continue
                      if any(term.lower() in data.lower() for term in content_terms):
                          content_matches.append(p)
              roots = {"imagestudio/backend/wayward-imagegen"}
              for p in matches | set(content_matches):
                  parts = p.split("/")
                  roots.add("/".join(parts[:-1]) if len(parts) > 1 else parts[0])
              copied = []
              for info in infos:
                  p = info.filename.replace("\\", "/")
                  if any(p == root or p.startswith(root.rstrip("/") + "/") for root in roots):
                      dest = out / p
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(zf.read(info))
                      copied.append(p)
              (out / "archive-manifest.json").write_text(json.dumps({
                  "archive_bytes": archive.stat().st_size,
                  "archive_sha256": digest,
                  "entry_count": len(infos),
                  "matches": sorted(matches),
                  "content_matches": content_matches,
                  "package_candidates": package_files,
                  "selected_roots": sorted(roots),
                  "copied_files": copied
              }, ensure_ascii=False, indent=2), encoding="utf-8")
              (out / "all-paths.txt").write_text(
                  "\\n".join(i.filename for i in zf.infolist()), encoding="utf-8"
              )
              print("COPIED_FILES", len(copied))
          PY
      - name: Verify canonical backend path and compare duplicate copy
        shell: bash
        run: |
          set -euo pipefail
          CANON="audit-output/imagestudio/backend/wayward-imagegen"
          NESTED="audit-output/image-search-customize/imagestudio/backend/wayward-imagegen"
          test -s "$CANON/package.json"
          test -s "$CANON/src/cli.ts"
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          a=Path("audit-output/imagestudio/backend/wayward-imagegen")
          b=Path("audit-output/image-search-customize/imagestudio/backend/wayward-imagegen")
          rows=[]
          for rel in ["package.json","src/cli.ts","src/server.ts","src/config.ts"]:
              left=a/rel; right=b/rel
              rows.append({
                  "file":rel,
                  "canonical_exists":left.is_file(),
                  "nested_exists":right.is_file(),
                  "canonical_sha256":hashlib.sha256(left.read_bytes()).hexdigest() if left.is_file() else None,
                  "nested_sha256":hashlib.sha256(right.read_bytes()).hexdigest() if right.is_file() else None,
                  "same":left.is_file() and right.is_file() and left.read_bytes()==right.read_bytes()
              })
          print("BACKEND_COPY_COMPARISON",json.dumps(rows))
          (Path("audit-output")/"backend-copy-comparison.json").write_text(json.dumps(rows,indent=2),encoding="utf-8")
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Verify Image Studio backend and start real local HTTP runtime
        shell: bash
        working-directory: audit-output/imagestudio/backend/wayward-imagegen
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/imagegen-images" "$RUNNER_TEMP/imagegen-state"
          bun --version
          bun install --production
          bun src/cli.ts --version
          bun src/cli.ts --help >/dev/null
          # Doctor must give a deterministic diagnosis when no GPU/ComfyUI is attached.
          set +e
          bun src/cli.ts doctor --comfy-url http://127.0.0.1:9 > "$RUNNER_TEMP/doctor.log" 2>&1
          doctor_status=$?
          set -e
          test "$doctor_status" -eq 1
          grep -F "ComfyUI is not answering" "$RUNNER_TEMP/doctor.log"
          # Start the actual TypeScript server (the no-GPU health route is still required to answer).
          bun src/cli.ts --port 18189 --no-webp \
            --images-dir "$RUNNER_TEMP/imagegen-images" \
            --state-dir "$RUNNER_TEMP/imagegen-state" \
            > "$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --show-error http://127.0.0.1:18189/api/pack -o "$RUNNER_TEMP/pack.json"; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/server.log"
              exit 1
            fi
            sleep 1
          done
          test "$ready" -eq 1
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const pack = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/pack.json', 'utf8'));
          assert.ok(pack && typeof pack === 'object');
          NODE
          code=$(curl --silent --show-error -o "$RUNNER_TEMP/health.json" -w '%{http_code}' http://127.0.0.1:18189/api/image/health)
          test "$code" = "503"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const health = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/health.json', 'utf8'));
          assert.equal(health.server, 'wayward-imagegen');
          assert.equal(health.status, 'error');
          assert.equal(health.comfyui, 'unavailable');
          assert.ok(health.version);
          console.log('IMAGEGEN_HTTP_RUNTIME_PASS', JSON.stringify({
            server: health.server, version: health.version,
            status: health.status, comfyui: health.comfyui,
            images: health.images, imageFormat: health.imageFormat
          }));
          NODE
          cp "$RUNNER_TEMP/doctor.log" "$RUNNER_TEMP/server.log" audit-runtime.log
          cp "$RUNNER_TEMP/health.json" audit-health.json
          cp "$RUNNER_TEMP/pack.json" audit-pack.json
      - name: Upload forensic and runtime report
        uses: actions/upload-artifact@v4
        with:
          name: mods-zip-runtime-audit
          path: |
            audit-output/
            audit-output/imagestudio/backend/wayward-imagegen/audit-runtime.log
            audit-output/imagestudio/backend/wayward-imagegen/audit-health.json
            audit-output/imagestudio/backend/wayward-imagegen/audit-pack.json
          if-no-files-found: error
          retention-days: 7
