name: Forensic inspect exact WML bootstrap and game id

on:
  push:
    branches:
      - forensic/mobile-ui-runtime-gate-20261108
    paths:
      - "scripts/inspect_wml_runtime_gate.js"
      - "scripts/probe_wml095_download.js"
      - ".github/workflows/forensic-wml-runtime-gate.yml"

permissions:
  contents: read

jobs:
  inspect-exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect exact WML source in 4 KiB binary chunks
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/inspect_wml_runtime_gate.js
          node scripts/inspect_wml_runtime_gate.js
      - name: Retrieve official WML 0.9.5 runtime package
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/probe_wml095_download.js
          node scripts/probe_wml095_download.js
      - name: Upload raw forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-wml-runtime-gate-evidence
          path: evidence/
          if-no-files-found: error
