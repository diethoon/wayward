name: Forensic inspect exact WML bootstrap and game id

on:
  push:
    branches:
      - forensic/mobile-ui-runtime-gate-20261108
    paths:
      - "scripts/inspect_wml_runtime_gate.js"
      - "scripts/inspect_wml_archive.js"
      - "scripts/test_actual_wml_runtime.js"
      - ".github/workflows/forensic-wml-runtime-gate.yml"

permissions:
  contents: read

jobs:
  inspect-exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect exact WML source in 4 KiB binary chunks
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/inspect_wml_runtime_gate.js
          node scripts/inspect_wml_runtime_gate.js
      - name: Inspect canonical package and WML 0.9.5 assets
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/inspect_wml_archive.js
          node scripts/inspect_wml_archive.js
      - name: Install isolated Chromium test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run actual game + WML 0.9.5 + migration module
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/test_actual_wml_runtime.js
          node scripts/test_actual_wml_runtime.js
      - name: Upload raw forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-wml-runtime-gate-evidence
          path: evidence/
          if-no-files-found: ignore
