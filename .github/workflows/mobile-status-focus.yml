name: Apply mobile portrait status and map surfaces

on:
  push:
    branches: [mobile-redesign-v1]
    paths:
      - "Wayward_MOD_v2.107.html"
      - ".github/workflows/mobile-status-focus.yml"
  pull_request:
    branches: [main]
    paths:
      - "Wayward_MOD_v2.107.html"
      - ".github/workflows/mobile-status-focus.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Patch mobile surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("Wayward_MOD_v2.107.html")
          s = p.read_text(encoding="utf-8")

          status_marker = "mobile-redesign-v1-status-focus"
          old1 = 'v=(A,C=!0)=>m.jsx(Pie,{hideWifeColumn:y,'
          new1 = 'v=(A,C=!0,D=y)=>m.jsx(Pie,{hideWifeColumn:D,'
          old2 = 'r==="focus"&&v(y?"inline":"external")'
          new2 = 'r==="focus"&&v("inline",!0,!1)'
          if status_marker not in s:
              if s.count(old1) != 1 or s.count(old2) != 1:
                  raise SystemExit("STATUS_GUARD_FAILED")
              s = s.replace(old1, new1, 1).replace(old2, new2, 1)
              s = s.replace(new1, '/*' + status_marker + '*/' + new1, 1)

          portrait_movement_marker = "mobile-redesign-v1-portrait-movement"
          if portrait_movement_marker not in s:
              old_shell = 'm.jsxs("div",{className:"lg:hidden flex-1 flex min-h-0",children:['
              new_shell = 'm.jsxs("div",{className:"lg:hidden mobile-game-shell flex-1 flex min-h-0",children:['
              old_panel = 'w-[37%] max-w-[13rem] desk:w-[16rem] desk:max-w-none shrink-0 flex flex-col min-h-0'
              new_panel = 'mobile-action-panel w-[37%] max-w-[13rem] desk:w-[16rem] desk:max-w-none shrink-0 flex flex-col min-h-0'
              old_movement = 'm.jsx("div",{className:"grid grid-cols-1 gap-2",children:m.jsx(jre,{dispatch:e,phase:n,playerLoc:A,wifeLoc:C,wife:o,customers:a,supplies:s,readyFood:r,tavernCleanliness:j,slot:y,playerEnergy:N,player:v,locations:S,tavern:$,outreachDone:E,activePatronInteraction:M,collectorCrewUnlocked:t.collectorCrewUnlocked})})'
              new_movement = 'm.jsx("div",{className:"mobile-movement-surface",children:m.jsx("div",{className:"grid grid-cols-1 gap-2",children:m.jsx(jre,{dispatch:e,phase:n,playerLoc:A,wifeLoc:C,wife:o,customers:a,supplies:s,readyFood:r,tavernCleanliness:j,slot:y,playerEnergy:N,player:v,locations:S,tavern:$,outreachDone:E,activePatronInteraction:M,collectorCrewUnlocked:t.collectorCrewUnlocked})})})'
              if s.count(old_shell) != 1 or s.count(old_panel) != 1 or s.count(old_movement) != 1:
                  raise SystemExit(f"PORTRAIT_MOVEMENT_GUARD_FAILED shell={s.count(old_shell)} panel={s.count(old_panel)} movement={s.count(old_movement)}")
              s = s.replace(old_shell,new_shell,1)
              s = s.replace(old_panel,new_panel,1)
              s = s.replace(old_movement,new_movement,1)
              portrait_css = """<style data-mobile-redesign="v1-portrait-movement">
@media(max-width:1023px) and (orientation:portrait){
  .mobile-game-shell{flex-direction:column!important}
  .mobile-game-shell .mobile-action-panel{width:100%!important;max-width:none!important;flex:0 0 min(38dvh,24rem)!important;min-height:0!important;order:0!important;border-bottom:1px solid rgb(68 64 60)!important}
  .mobile-game-shell .mobile-action-panel>div:first-child{min-height:0!important;overflow-y:auto!important}
  .mobile-movement-surface{position:sticky;top:0;z-index:20;margin:0 0 .5rem!important;padding:.35rem 0 .5rem!important;background:rgb(28 25 23 / 96%)!important;border-bottom:1px solid rgb(68 64 60)!important}
}
</style>"""
              head_count = s.count("</head>")
              if head_count != 1:
                  raise SystemExit(f"PORTRAIT_MOVEMENT_HEAD_GUARD_FAILED count={head_count}")
              s = s.replace("</head>",portrait_css+"</head>",1)
              print("PORTRAIT_MOVEMENT_PATCH=applied")
          map_marker = "mobile-redesign-v1-mobile-map-surface"
          map_anchor = ".map-pinned>div{margin:0!important;border:0!important;background:transparent!important}"
          if map_marker not in s:
              if s.count(map_anchor) != 1:
                  raise SystemExit(f"MAP_GUARD_FAILED anchor count={s.count(map_anchor)}")
              map_css = map_anchor + ".map-pinned{position:fixed!important;inset:0!important;z-index:15!important;width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important;overflow:auto!important;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)!important;background:rgba(12,10,9,.98)!important;overscroll-behavior:contain!important;touch-action:pan-x pan-y!important;isolation:isolate!important}/*" + map_marker + "*/"
              s = s.replace(map_anchor, map_css, 1)

          p.write_text(s, encoding="utf-8")
          print("MOBILE_SURFACE_PATCH=PASS")
          PY

      - name: Validate HTML script syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          raw = Path("Wayward_MOD_v2.107.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", raw, flags=re.I | re.S)
          if not blocks:
              raise SystemExit("NO_INLINE_SCRIPT")
          Path("/tmp/wayward-inline.js").write_text("\n".join(blocks), encoding="utf-8")
          print("INLINE_SCRIPTS", len(blocks))
          PY
          node --check /tmp/wayward-inline.js
          git diff --check

      - name: Guard changed scope
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --name-only)"
          test "$files" = "Wayward_MOD_v2.107.html"
          git diff --unified=0 -- Wayward_MOD_v2.107.html | grep -E 'mobile-redesign-v1-status-focus|mobile-redesign-v1-mobile-map-surface|hideWifeColumn:D|r==="focus"&&v("inline",!0,!1)'

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayward_MOD_v2.107.html
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "fix: apply mobile status and map surfaces"
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
