name: Forensic mobile UI package extraction

on:
  push:
    branches:
      - forensic/ui-save-compat-20261107
    paths:
      - ".github/workflows/forensic-ui-extract.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify original source in 4096-byte chunks and extract packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forensic-output/pkg-438 forensic-output/pkg-437

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess, zipfile

          root = Path(".")
          source = root / "Wayward_MOD_v2.107.html"
          data_size = source.stat().st_size
          chunks = []
          total = hashlib.sha256()
          offset = 0
          with source.open("rb") as f:
              while True:
                  b = f.read(4096)
                  if not b:
                      break
                  total.update(b)
                  chunks.append({"offset": offset, "length": len(b), "sha256": hashlib.sha256(b).hexdigest()})
                  offset += len(b)
          assert offset == data_size
          manifest = {
              "repository": "diethoon/wayward",
              "branch": "forensic/ui-save-compat-20261107",
              "base_commit": "4babcaff70e65af6c804e126d8ff9af5eb19dc6a",
              "source_path": str(source),
              "source_bytes": data_size,
              "source_sha256": total.hexdigest(),
              "chunk_bytes": 4096,
              "chunks": chunks,
          }
          Path("forensic-output/source-chunk-manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")

          packages = [
              ("mobile-ui-migration-438-v1.3.8.zip", Path("forensic-output/pkg-438")),
              ("mobile-ui-migration-438-v1.3.8.zip", Path("forensic-output/pkg-438")),
          ]
          for zip_name, out in packages[:1]:
              with zipfile.ZipFile(zip_name) as z:
                  z.extractall(out)
                  listing = [{"path": x.filename, "size": x.file_size, "crc": f"{x.CRC:08x}"} for x in z.infolist()]
              (out / "zip-listing.json").write_text(json.dumps(listing, indent=2), encoding="utf-8")

          old_zip = Path("mobile-ui-migration-437-v1.3.10.zip")
          if old_zip.exists():
              out = Path("forensic-output/pkg-437")
              with zipfile.ZipFile(old_zip) as z:
                  z.extractall(out)
                  listing = [{"path": x.filename, "size": x.file_size, "crc": f"{x.CRC:08x}"} for x in z.infolist()]
              (out / "zip-listing.json").write_text(json.dumps(listing, indent=2), encoding="utf-8")

          for p in Path("forensic-output").rglob("*"):
              if p.is_file():
                  print(f"{p} {p.stat().st_size} bytes")
          print("SOURCE", data_size, total.hexdigest(), "chunks", len(chunks))
          PY

      - name: Syntax-check extracted JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find forensic-output -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do
            echo "node --check $f"
            node --check "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: forensic-ui-extract
          path: forensic-output/
          if-no-files-found: error

      - name: Inspect the exact 4.37 MB WML source in 4096-byte chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          source = Path("Wayward_WML_ko.html")
          size = source.stat().st_size
          total = hashlib.sha256()
          chunks = []
          offset = 0
          with source.open("rb") as f:
              while True:
                  b = f.read(4096)
                  if not b:
                      break
                  total.update(b)
                  chunks.append({"offset": offset, "length": len(b), "sha256": hashlib.sha256(b).hexdigest()})
                  offset += len(b)
          assert offset == size
          raw = source.read_bytes()
          terms = [
              b"function vle(", b"function Wre(", b"function lre(",
              b"function hoe(", b"function itt(", b"function cst(",
              b"function Xrt(", b"function SB(", b"function sB(",
              b"function qoe(", b"function loe(",
              "당신의 대응이 필요한 상황".encode(),
              "대화에 끼기".encode(),
          ]
          hits = {}
          for term in terms:
              offsets = []
              start = 0
              while len(offsets) < 8:
                  pos = raw.find(term, start)
                  if pos < 0:
                      break
                  offsets.append(pos)
                  start = pos + len(term)
              hits[term.decode("utf-8")] = offsets
          manifest = {
              "repository": "diethoon/wayward",
              "branch": "forensic/ui-save-compat-20261107",
              "base_commit": "4babcaff70e65af6c804e126d8ff9af5eb19dc6a",
              "source_path": str(source),
              "source_git_blob_sha": "d198eacfc127c55dc44bd5d1b8e29ff2bb7d08e6",
              "source_bytes": size,
              "source_sha256": total.hexdigest(),
              "chunk_bytes": 4096,
              "chunks": chunks,
              "string_hits": hits,
          }
          out = Path("forensic-output/wml-source")
          out.mkdir(parents=True, exist_ok=True)
          (out / "source-chunk-manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          contexts=[]
          for term, offsets in hits.items():
              for pos in offsets[:2]:
                  lo=max(0,pos-350)
                  hi=min(len(raw),pos+(5200 if term.startswith("function ") else 1400))
                  contexts.append({"term":term,"offset":pos,"context":raw[lo:hi].decode("utf-8","replace")})
          (out / "targeted-contexts.json").write_text(json.dumps(contexts, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps({k:v for k,v in manifest.items() if k!="chunks"}, indent=2))
          print("chunks", len(chunks), "bytes verified", offset)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: forensic-ui-wml-source
          path: forensic-output/wml-source/
          if-no-files-found: error

      - name: Identify actual response-alert and story-layout component owners
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          raw=Path("Wayward_WML_ko.html").read_bytes()
          terms=["당신의 대응이 필요한 상황".encode(), "대화에 끼기".encode()]
          out=[]
          for term in terms:
              starts=[]; p=0
              while True:
                  p=raw.find(term,p)
                  if p<0: break
                  starts.append(p);p+=len(term)
              for pos in starts:
                  lo=max(0,pos-8000); hi=min(len(raw),pos+3000)
                  window=raw[lo:hi].decode("utf-8","replace")
                  prefix=raw[:pos].decode("utf-8","replace")
                  funcs=list(re.finditer(r"function\\s+([A-Za-z_$][\\w$]*)\\s*\\([^)]*\\)\\s*\\{",prefix))
                  owner=funcs[-1].group(1) if funcs else None
                  owner_pos=funcs[-1].start() if funcs else None
                  owner_uses=[]
                  if owner:
                      for m in list(re.finditer(r"\\b"+re.escape(owner)+r"\\b",raw.decode("utf-8","replace")))[:20]:
                          owner_uses.append(m.start())
                  out.append({"term":term.decode(),"offset":pos,"nearest_function":owner,"function_offset":owner_pos,"name_occurrences":owner_uses,"context":window})
          target=Path("forensic-output/wml-source/response-alert-owner-contexts.json")
          target.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          for row in out:
              print(row["term"],"offset",row["offset"],"owner",row["nearest_function"],"fn_offset",row["function_offset"],"uses",row["name_occurrences"][:10])
              print(row["context"][:7600])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: forensic-ui-response-alert-owners
          path: forensic-output/wml-source/response-alert-owner-contexts.json
          if-no-files-found: error
