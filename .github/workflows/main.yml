      - name: Split HTML by lines
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path("Wayward_MOD_v2.107.html")
          out = Path("analysis_parts")
          out.mkdir(exist_ok=True)

          lines = src.read_text(encoding="utf-8").splitlines(keepends=True)

          max_chars = 400_000
          part = []
          size = 0
          index = 1

          for line in lines:
              if part and size + len(line) > max_chars:
                  path = out / f"Wayward_MOD_v2.107.part{index:03d}.txt"
                  path.write_text("".join(part), encoding="utf-8")

                  print(
                      f"{path}: "
                      f"{len(part)} lines / {size:,} chars"
                  )

                  index += 1
                  part = []
                  size = 0

              part.append(line)
              size += len(line)

          if part:
              path = out / f"Wayward_MOD_v2.107.part{index:03d}.txt"
              path.write_text("".join(part), encoding="utf-8")
              print(
                  f"{path}: "
                  f"{len(part)} lines / {size:,} chars"
              )

          print("TOTAL LINES:", len(lines))
          print("TOTAL PARTS:", index)
          PY
