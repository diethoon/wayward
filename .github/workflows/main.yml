name: Split Wayward HTML for analysis

on:
  push:
    branches: [main]
    paths:
      - "Wayward_MOD_v2.107.html"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate character-safe analysis parts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re
          from collections import Counter

          src = Path("Wayward_MOD_v2.107.html")
          out = Path("analysis_parts")
          out.mkdir(exist_ok=True)

          for p in out.glob("Wayward_MOD_v2.107.part*.txt"):
              p.unlink()

          raw = src.read_text(encoding="utf-8")
          total_chars = len(raw)
          total_lines = raw.count("\n") + (1 if raw else 0)
          sha256 = hashlib.sha256(raw.encode("utf-8")).hexdigest()

          # The previous splitter used line boundaries and produced one ~2.47M-char
          # chunk because the source contains an enormous single line. Split by
          # character count instead so every generated file remains connector-safe.
          chunk_chars = 80_000
          parts = []

          for offset in range(0, total_chars, chunk_chars):
              chunk = raw[offset:offset + chunk_chars]
              index = len(parts) + 1
              name = f"Wayward_MOD_v2.107.part{index:03d}.txt"
              (out / name).write_text(chunk, encoding="utf-8")
              parts.append({
                  "name": name,
                  "char_start": offset + 1,
                  "char_end": offset + len(chunk),
                  "chars": len(chunk),
              })

          def n(pattern, flags=re.I):
              return len(re.findall(pattern, raw, flags))

          tags = Counter(re.findall(r"<\s*([A-Za-z][\w:-]*)\b", raw))
          ids = re.findall(r'\bid\s*=\s*["\']([^"\']+)["\']', raw, re.I)
          class_attrs = re.findall(r'\bclass\s*=\s*["\']([^"\']+)["\']', raw, re.I)
          events = re.findall(r'addEventListener\s*\(\s*["\']([^"\']+)', raw, re.I)
          functions = re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(', raw)
          script_srcs = re.findall(r'<script[^>]+\bsrc\s*=\s*["\']([^"\']+)', raw, re.I)

          lines = raw.splitlines()
          max_line_len = max((len(x) for x in lines), default=0)
          max_line_no = next((i for i, x in enumerate(lines, 1) if len(x) == max_line_len), 0)

          report = {
              "source": str(src),
              "sha256": sha256,
              "bytes_utf8": len(raw.encode("utf-8")),
              "chars": total_chars,
              "lines": total_lines,
              "max_line_chars": max_line_len,
              "max_line_number": max_line_no,
              "chunk_chars": chunk_chars,
              "parts": parts,
              "counts": {
                  "script_tags": n(r"<\s*script\b"),
                  "style_tags": n(r"<\s*style\b"),
                  "button_tags": n(r"<\s*button\b"),
                  "input_tags": n(r"<\s*input\b"),
                  "img_tags": n(r"<\s*img\b"),
                  "form_tags": n(r"<\s*form\b"),
                  "event_attributes": n(r"\bon[a-z]+\s*="),
                  "addEventListener": len(events),
                  "named_functions": len(functions),
                  "fetch_calls": n(r"\bfetch\s*\("),
                  "localStorage_refs": n(r"\blocalStorage\b"),
                  "sessionStorage_refs": n(r"\bsessionStorage\b"),
                  "media_queries": n(r"@media\b"),
                  "position_fixed": n(r"position\s*:\s*fixed\b"),
                  "position_sticky": n(r"position\s*:\s*sticky\b"),
                  "overflow_auto_scroll": n(r"overflow(?:-x|-y)?\s*:\s*(?:auto|scroll)\b"),
                  "viewport_meta": n(r'<meta\b[^>]*\bname\s*=\s*["\']viewport["\']'),
              },
              "tag_counts": dict(tags.most_common(100)),
              "script_srcs": script_srcs,
              "unique_id_count": len(set(ids)),
              "duplicate_id_count": len(ids) - len(set(ids)),
              "class_attribute_count": len(class_attrs),
              "event_types": dict(Counter(events)),
              "function_names": functions[:1000],
          }

          (out / "MANIFEST.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          manifest_lines = [
              f"source={src}",
              f"sha256={sha256}",
              f"bytes_utf8={report['bytes_utf8']}",
              f"chars={total_chars}",
              f"lines={total_lines}",
              f"max_line_chars={max_line_len}",
              f"max_line_number={max_line_no}",
              f"chunk_chars={chunk_chars}",
              f"parts={len(parts)}",
              "",
          ]
          manifest_lines += [
              f"{p['name']}\tchars {p['char_start']}-{p['char_end']}\tcount {p['chars']}"
              for p in parts
          ]
          (out / "MANIFEST.txt").write_text(
              "\n".join(manifest_lines) + "\n",
              encoding="utf-8"
          )

          # Concise text report for quick inspection without loading the source.
          text_report = [
              "# Wayward_MOD_v2.107 full-source static inventory",
              f"- SHA-256: {sha256}",
              f"- UTF-8 bytes: {report['bytes_utf8']:,}",
              f"- characters: {total_chars:,}",
              f"- lines: {total_lines:,}",
              f"- maximum single line: {max_line_len:,} chars (line {max_line_no})",
              f"- analysis parts: {len(parts)} × <= {chunk_chars:,} chars",
              "",
              "## Counts",
          ]
          text_report += [f"- {k}: {v:,}" for k, v in report["counts"].items()]
          text_report += [
              "",
              "## Largest/most common HTML tags",
          ]
          text_report += [f"- {k}: {v:,}" for k, v in tags.most_common(60)]
          text_report += [
              "",
              "## Media-query conditions",
          ]
          for m in re.findall(r"@media\s*([^\{]+)\{", raw, re.I)[:100]:
              text_report.append(f"- {m.strip()}")
          text_report += [
              "",
              "## Function index (first 600)",
          ]
          for m in re.finditer(r"\bfunction\s+([A-Za-z_$][\w$]*)\s*\(", raw):
              line_no = raw.count("\n", 0, m.start()) + 1
              text_report.append(f"- line {line_no}: {m.group(1)}()")
              if len(text_report) > 700:
                  break
          (out / "ANALYSIS_REPORT.md").write_text(
              "\n".join(text_report) + "\n",
              encoding="utf-8"
          )

          print(f"TOTAL_LINES={total_lines}")
          print(f"TOTAL_CHARS={total_chars}")
          print(f"TOTAL_PARTS={len(parts)}")
          print(f"MAX_LINE_CHARS={max_line_len}")
          print(f"MAX_LINE_NUMBER={max_line_no}")
          print(f"SHA256={sha256}")
          PY

      - name: Commit generated analysis data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_parts/
          git commit -m "chore: regenerate Wayward analysis parts" || echo "No changes"
          git push
