          raw = raw.replace(
              compact_header,
              'children:[!y&&m.jsx("div",{className:"shrink-0 border-b border-stone-700",children:m.jsx(M0,{compact:!0})}),!y&&m.jsx(MobileStatusSummary,{}),m.jsxs("div",{className:"flex-1',
              1
          )

          # Preserve viewport scaling at a normal 1.0 baseline.
          idx = index.read_text(encoding="utf-8")
          vp_old = 'content="width=device-width, initial-scale=0.8, maximum-scale=5.0, viewport-fit=cover"'
          if idx.count(vp_old) != 1:
              raise SystemExit("VIEWPORT_GUARD")
          index.write_text(idx.replace(vp_old,'content="width=device-width, initial-scale=1, maximum-scale=5.0, viewport-fit=cover"',1),encoding="utf-8")

          # Portrait/mobile presentation rules. No game-state or action changes.
          styles = css.read_text(encoding="utf-8")
          if "/* Wayward mobile portrait UI/UX */" in styles:
              raise SystemExit("CSS_ALREADY_PRESENT")
          styles += r'''
          
          /* Wayward mobile portrait UI/UX */
          @media (max-width: 1023px) and (orientation: portrait) {
            .mobile-layout { flex-direction: column; overflow: hidden; }
            .mobile-main-panel { order: 1 !important; width: 100% !important; min-width: 0; border-left: 0 !important; border-right: 0 !important; }
            .mobile-action-panel { order: 2 !important; width: 100% !important; max-width: none !important; flex: 0 0 auto; max-height: 38dvh; overflow-y: auto; border-top: 1px solid rgba(120,113,108,.55); padding-bottom: max(.2rem, env(safe-area-inset-bottom)); }
            .mobile-location-section { margin: 0 0 .6rem; padding: .55rem; border: 1px solid rgba(120,113,108,.45); border-radius: .55rem; background: rgba(28,25,23,.7); }
            .mobile-section-title { margin: 0 0 .35rem; font-size: .62rem; font-weight: 700; letter-spacing: .08em; color: rgb(168 162 158); }
            .mobile-status-summary { padding: .45rem .55rem; border-bottom: 1px solid rgba(68,64,60,.8); background: rgba(28,25,23,.96); }
            .mobile-status-title { margin-bottom: .3rem; font-size: .58rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: rgb(168 162 158); }
            .mobile-status-grid { display: grid; grid-template-columns: 1fr; gap: 1px; }
            .mobile-status-row { width: 100%; display: grid; grid-template-columns: 4.2rem minmax(0,1fr); gap: .35rem; align-items: baseline; padding: .3rem .2rem; border-radius: .3rem; text-align: left; }
            .mobile-status-row:active, .mobile-status-row[aria-expanded="true"] { background: rgba(120,53,15,.22); }
            .mobile-status-label { color: rgb(120 113 108); font-size: .68rem; white-space: nowrap; }
            .mobile-status-value { min-width: 0; color: rgb(231 229 228); font-size: .72rem; line-height: 1.25; white-space: normal; word-break: keep-all; overflow-wrap: normal; }
            .mobile-status-detail { margin: 0 .2rem .25rem 4.2rem; padding: .45rem .5rem; border-left: 2px solid rgba(120,53,15,.6); background: rgba(12,10,9,.62); color: rgb(168 162 158); font-size: .68rem; line-height: 1.35; overflow-wrap: break-word; }
            .mobile-live-status { display: flex; flex-wrap: wrap; gap: .3rem .45rem; padding: .4rem .2rem 0; margin-top: .25rem; color: rgb(214 211 209); font-size: .7rem; line-height: 1.35; word-break: keep-all; }
            .mobile-live-status-label { color: rgb(180 83 9); font-weight: 700; white-space: nowrap; }
            .mobile-live-status-meta { width: 100%; color: rgb(120 113 108); font-size: .64rem; }
            .mobile-location-section button, .mobile-action-panel button { word-break: keep-all; overflow-wrap: normal; }
            #wc2-toggle { left: auto !important; right: max(8px, env(safe-area-inset-right)) !important; bottom: max(8px, env(safe-area-inset-bottom)) !important; opacity: .28 !important; transform: scale(.82) !important; z-index: 30 !important; }
            #wc2-toggle:active, #wc2-toggle:focus-visible { opacity: .9 !important; transform: scale(1) !important; }
          }
          @media (max-width: 430px) and (orientation: portrait) {
            .mobile-action-panel { max-height: 34dvh; }
            .mobile-status-row { grid-template-columns: 3.8rem minmax(0,1fr); }
            .mobile-status-detail { margin-left: 3.8rem; }
          }
          '''
          css.write_text(styles,encoding="utf-8")

          for p in (src,index,css):
              data=p.read_text(encoding="utf-8")
              if not data.strip() or not data.endswith("\\n"):
                  raise SystemExit("EOF_GUARD:" + str(p))
          src.write_text(raw,encoding="utf-8")
          print("PATCH_APPLIED")
          PY

      - name: Validate studio patch
        shell: bash
        run: |
          set -euo pipefail
          node --check src/main.js
          git diff --check
          git diff --name-only > /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt)" -eq 3
          grep -Fxq 'src/main.js' /tmp/changed.txt
          grep -Fxq 'index.html' /tmp/changed.txt
          grep -Fxq 'game_style.css' /tmp/changed.txt
          test -s src/main.js
          tail -c 4000 src/main.js > /tmp/main_tail.txt
          test -s /tmp/main_tail.txt
          grep -q 'function MobileStatusSummary' <(git diff -- src/main.js)
          grep -q 'mobile-location-section' <(git diff -- src/main.js)
          echo "NODE_CHECK=PASS"
          echo "DIFF_CHECK=PASS"
          echo "EOF_CHECK=PASS"
          echo "CHANGE_SCOPE=PASS"

      - name: Commit studio mobile patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js index.html game_style.css
          git commit -m "fix: stabilize studio mobile portrait layout"
          git push origin "HEAD:$GITHUB_REF_NAME"
