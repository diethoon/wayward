name: Split Wayward HTML for analysis

on:
  push:
    branches: [main, mobile-redesign-v1, studio]
    paths:
      - "Wayward_MOD_v2.107.html"
      - ".github/workflows/main.yml"
  workflow_dispatch:

concurrency:
  group: wayward-mobile-redesign-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  split:
    if: github.ref != 'refs/heads/studio'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate full-source analysis material
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re
          from collections import Counter

          src = Path("Wayward_MOD_v2.107.html")
          out = Path("analysis_parts")
          out.mkdir(exist_ok=True)

          raw = src.read_text(encoding="utf-8")
          sha256 = hashlib.sha256(raw.encode("utf-8")).hexdigest()
          total_chars = len(raw)
          total_bytes = len(raw.encode("utf-8"))
          lines = raw.splitlines()
          total_lines = len(lines)

          for p in out.glob("Wayward_MOD_v2.107.part*.txt"):
              p.unlink()

          chunk_chars = 80_000
          parts = []
          for offset in range(0, total_chars, chunk_chars):
              chunk = raw[offset:offset + chunk_chars]
              idx = len(parts) + 1
              name = f"Wayward_MOD_v2.107.part{idx:03d}.txt"
              (out / name).write_text(chunk, encoding="utf-8")
              parts.append({
                  "name": name,
                  "char_start": offset + 1,
                  "char_end": offset + len(chunk),
                  "chars": len(chunk),
              })

          body_m = re.search(r"<body\b[^>]*>(.*?)</body\s*>", raw, re.I | re.S)
          body = body_m.group(1) if body_m else ""
          ui_body = re.sub(r"<script\b[^>]*>.*?</script\s*>", "", body, flags=re.I | re.S)
          ui_body = re.sub(r"<style\b[^>]*>.*?</style\s*>", "", ui_body, flags=re.I | re.S)

          html_tag_counts = Counter(
              m.group(1).lower()
              for m in re.finditer(r"<\s*([A-Za-z][\w:-]*)\b", ui_body)
          )
          html_ids = re.findall(r'\bid\s*=\s*["\']([^"\']+)["\']', ui_body, re.I)
          html_classes = []
          for x in re.findall(r'\bclass\s*=\s*["\']([^"\']+)["\']', ui_body, re.I):
              html_classes.extend([v for v in x.split() if v])

          visible_text = re.sub(r"<!--.*?-->", " ", ui_body, flags=re.S)
          visible_text = re.sub(r"<[^>]+>", " ", visible_text)
          visible_text = re.sub(r"\s+", " ", visible_text).strip()

          (out / "UI_HTML.txt").write_text(ui_body.strip() + "\n", encoding="utf-8")
          (out / "UI_TEXT.txt").write_text(visible_text + "\n", encoding="utf-8")

          style_blocks = re.findall(r"<style\b[^>]*>(.*?)</style\s*>", raw, re.I | re.S)
          css = "\n\n".join(
              f"/* STYLE BLOCK {i+1} */\n{x}" for i, x in enumerate(style_blocks)
          )
          (out / "CSS_FULL.txt").write_text(css + "\n", encoding="utf-8")

          css_rule_rows = []
          css_media = []
          for css_block_no, block in enumerate(style_blocks, 1):
              for m in re.finditer(r"([^{}]+)\{([^{}]*)\}", block, re.S):
                  selector = re.sub(r"\s+", " ", m.group(1)).strip()
                  body_css = re.sub(r"\s+", " ", m.group(2)).strip()
                  if selector:
                      css_rule_rows.append((css_block_no, selector, body_css))
              for m in re.finditer(r"@media\s*([^\{]+)\{", block, re.I):
                  css_media.append(m.group(1).strip())

          css_tokens = Counter()
          for prop in re.findall(r"([A-Za-z-]+)\s*:", css):
              css_tokens[prop.lower()] += 1

          script_blocks = re.findall(r"<script\b([^>]*)>(.*?)</script\s*>", raw, re.I | re.S)
          fn_rows = []
          for m in re.finditer(r"\bfunction\s+([A-Za-z_$][\w$]*)\s*\(", raw):
              fn_rows.append((m.group(1), raw.count("\n", 0, m.start()) + 1))

          event_types = Counter(
              m.group(1)
              for m in re.finditer(r"addEventListener\s*\(\s*['\"]([^'\"]+)", raw, re.I)
          )
          selectors = re.findall(
              r"\b(?:getElementById|querySelector|querySelectorAll|getElementsByClassName|getElementsByTagName)"
              r"\s*\(\s*['\"]([^'\"]+)['\"]",
              raw,
          )
          storage_keys = re.findall(
              r"\b(?:localStorage|sessionStorage)\."
              r"(?:getItem|setItem|removeItem)\s*\(\s*['\"]([^'\"]+)['\"]",
              raw,
          )
          urls = re.findall(
              r"\b(?:fetch|WebSocket|EventSource)\s*\(\s*['\"]([^'\"]+)",
              raw,
          )

          fn_prefix = Counter()
          for name, _ in fn_rows:
              base = re.sub(r"\d+$", "", name)
              fn_prefix[base[:32] if base else name[:32]] += 1

          snippet_patterns = [
              ("DOM mutation", r"innerHTML|outerHTML|insertAdjacentHTML|createElement|appendChild|replaceChildren"),
              ("class/style", r"classList\.|\.style\.|setAttribute\(|removeAttribute\("),
              ("responsive", r"matchMedia\(|innerWidth|innerHeight|resize|orientation"),
              ("input/touch", r"touchstart|touchmove|touchend|pointerdown|pointerup|keydown|keyup"),
              ("navigation", r"location\.|history\.|URLSearchParams|pushState|replaceState"),
              ("save/load", r"localStorage|sessionStorage|autosave|save|load"),
              ("modal/panel", r"modal|overlay|drawer|panel|dialog|menu"),
          ]

          snippet_lines = []
          seen = set()
          for label, pattern in snippet_patterns:
              for m in re.finditer(pattern, raw, re.I):
                  pos = m.start()
                  line_no = raw.count("\n", 0, pos) + 1
                  key = (label, line_no, m.group(0).lower())
                  if key in seen:
                      continue
                  seen.add(key)
                  lo = max(0, pos - 500)
                  hi = min(len(raw), pos + 900)
                  ctx = re.sub(r"\s+", " ", raw[lo:hi].replace("\n", " ")).strip()
                  snippet_lines.append(f"## {label} | line {line_no}\nSNIPPET: {ctx}\n")
                  if len(snippet_lines) >= 220:
                      break
              if len(snippet_lines) >= 220:
                  break

          max_line_len = max((len(x) for x in lines), default=0)
          max_line_no = next((i for i, x in enumerate(lines, 1) if len(x) == max_line_len), 0)

          manifest = {
              "source": str(src),
              "sha256": sha256,
              "bytes_utf8": total_bytes,
              "chars": total_chars,
              "lines": total_lines,
              "chunk_chars": chunk_chars,
              "parts": parts,
              "max_line_chars": max_line_len,
              "max_line_number": max_line_no,
              "html": {
                  "body_chars": len(body),
                  "ui_body_chars": len(ui_body),
                  "tag_counts": dict(html_tag_counts),
                  "id_count": len(html_ids),
                  "duplicate_id_count": len(html_ids) - len(set(html_ids)),
                  "class_token_count": len(html_classes),
                  "unique_class_count": len(set(html_classes)),
              },
              "css": {
                  "style_blocks": len(style_blocks),
                  "css_chars": len(css),
                  "rule_count": len(css_rule_rows),
                  "media_queries": css_media,
                  "property_frequency": dict(css_tokens.most_common(100)),
              },
              "javascript": {
                  "script_blocks": [{"attrs": a, "chars": len(code)} for a, code in script_blocks],
                  "named_function_count": len(fn_rows),
                  "event_types": dict(event_types),
                  "selector_count": len(selectors),
                  "storage_keys": sorted(set(storage_keys)),
                  "network_targets": sorted(set(urls)),
              },
          }

          (out / "MANIFEST.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")

          manifest_txt = [
              f"source={src}",
              f"sha256={sha256}",
              f"bytes_utf8={total_bytes}",
              f"chars={total_chars}",
              f"lines={total_lines}",
              f"max_line_chars={max_line_len}",
              f"max_line_number={max_line_no}",
              f"chunk_chars={chunk_chars}",
              f"parts={len(parts)}",
              "",
          ]
          manifest_txt += [f"{p['name']}\tchars {p['char_start']}-{p['char_end']}\tcount {p['chars']}" for p in parts]
          (out / "MANIFEST.txt").write_text("\n".join(manifest_txt) + "\n", encoding="utf-8")

          report = [
              "# Wayward_MOD_v2.107 전체 소스 구조 분석",
              "",
              "## 원본",
              f"- SHA-256: {sha256}",
              f"- UTF-8 bytes: {total_bytes:,}",
              f"- characters: {total_chars:,}",
              f"- lines: {total_lines:,}",
              f"- max single line: {max_line_len:,} chars (line {max_line_no})",
              "",
              "## UI HTML",
              f"- body chars: {len(body):,}",
              f"- UI HTML chars after removing script/style: {len(ui_body):,}",
              f"- id count: {len(html_ids):,}",
              f"- duplicate id count: {len(html_ids)-len(set(html_ids)):,}",
              f"- class tokens: {len(html_classes):,}",
              f"- unique classes: {len(set(html_classes)):,}",
              "",
              "### HTML tags",
          ]
          report += [f"- {k}: {v}" for k, v in html_tag_counts.most_common()]
          report += ["", "## CSS", f"- style blocks: {len(style_blocks)}", f"- CSS chars: {len(css):,}", f"- CSS rule candidates: {len(css_rule_rows):,}", "", "### media queries"]
          report += [f"- {x}" for x in css_media]
          report += ["", "### common properties"]
          report += [f"- {k}: {v}" for k, v in css_tokens.most_common(100)]
          report += ["", "### largest CSS rules"]
          for block_no, selector, body_css in sorted(css_rule_rows, key=lambda x: len(x[2]), reverse=True)[:120]:
              report.append(f"- [style {block_no}] {selector} => {body_css[:500]}")
          report += ["", "## JavaScript", f"- script blocks: {len(script_blocks)}", f"- named functions: {len(fn_rows):,}", f"- addEventListener types: {dict(event_types)}", f"- DOM selector calls: {len(selectors):,}", "", "### storage keys"]
          report += [f"- {x}" for x in sorted(set(storage_keys))]
          report += ["", "### network targets"]
          report += [f"- {x}" for x in sorted(set(urls))]
          report += ["", "### notable function names"]
          for name, line_no in fn_rows[:500]:
              report.append(f"- line {line_no}: {name}()")
          report += ["", "### function-name families"]
          report += [f"- {k}: {v}" for k, v in fn_prefix.most_common(120)]
          (out / "STATIC_REPORT.md").write_text("\n".join(report) + "\n", encoding="utf-8")

          (out / "UI_SNIPPETS.md").write_text(
              "# UI/runtime targeted source snippets\n\n" + "\n".join(snippet_lines),
              encoding="utf-8",
          )

          print(f"FULL SOURCE: {total_chars:,} chars / {total_bytes:,} bytes / {total_lines:,} lines")
          print(f"PARTS: {len(parts)}")
          print(f"MAX LINE: {max_line_len:,} chars at line {max_line_no}")
          print(f"BODY: {len(body):,} chars; UI HTML: {len(ui_body):,} chars")
          print(f"CSS: {len(css):,} chars across {len(style_blocks)} style blocks")
          print(f"JS FUNCTIONS: {len(fn_rows):,}")
          PY


      - name: Generate UI component index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter

          src=Path("Wayward_MOD_v2.107.html")
          out=Path("analysis_parts")
          raw=src.read_text(encoding="utf-8")

          # React/runtime markers
          markers=[]
          for pat,label in [
              (r"createRoot","createRoot"),
              (r"\.render\s*\(","render-call"),
              (r"hydrateRoot","hydrateRoot"),
              (r"createElement","createElement"),
              (r"m\.jsx\s*\(","jsx-runtime"),
              (r"m\.jsxs\s*\(","jsxs-runtime"),
          ]:
              for m in re.finditer(pat,raw):
                  markers.append((label,raw.count("\n",0,m.start())+1,m.start()))

          # Named functions that contain JSX runtime calls nearby.
          fn_rows=[]
          for m in re.finditer(r"\bfunction\s+([A-Za-z_$][\w$]*)\s*\([^)]*\)\s*\{",raw):
              name=m.group(1)
              start=m.start()
              line=raw.count("\n",0,start)+1
              sample=raw[start:min(len(raw),start+12000)]
              if re.search(r"m\.jsx\s*\(|m\.jsxs\s*\(",sample):
                  classes=re.findall(r'className\s*:\s*"([^"]*)"',sample)
                  layout_tokens=Counter(
                      tok for c in classes for tok in c.split()
                      if tok in {
                          "flex","flex-col","flex-row","grid","grid-cols-1","grid-cols-2",
                          "grid-cols-3","grid-cols-4","flex-1","w-full","h-full","h-screen",
                          "fixed","sticky","absolute","overflow-hidden","overflow-y-auto",
                          "overflow-x-auto","min-h-0","min-w-0","items-center","justify-center"
                      } or tok.startswith(("grid-cols-","max-h-","max-w-","min-h-","min-w-"))
                  )
                  fn_rows.append({
                      "name":name,
                      "line":line,
                      "sample_chars":len(sample),
                      "class_count":len(classes),
                      "classes":list(dict.fromkeys(classes))[:30],
                      "layout_tokens":dict(layout_tokens.most_common()),
                  })

          # JSX className literals across whole source.
          class_literals=re.findall(r'className\s*:\s*"([^"]*)"',raw)
          cls=Counter(tok for c in class_literals for tok in c.split())

          report=[]
          report.append("# UI component / runtime index")
          report.append("")
          report.append("## Runtime markers")
          for label,line,pos in markers[:300]:
              report.append(f"- line {line}: {label}")
          report.append("")
          report.append(f"## JSX component/function candidates: {len(fn_rows)}")
          report.append("")
          for x in fn_rows:
              report.append(f"### {x['name']} (line {x['line']})")
              report.append(f"- sample chars: {x['sample_chars']}")
              report.append(f"- class literals: {x['class_count']}")
              report.append(f"- layout tokens: {x['layout_tokens']}")
              for c in x["classes"]:
                  if any(k in c for k in ("fixed","sticky","grid","flex","overflow","h-screen","100dvh","max-h","max-w","min-h","min-w","w-full")):
                      report.append(f"  - {c}")
              report.append("")
          report.append("## Global JSX layout token frequency")
          for k,v in cls.most_common(160):
              if any(s in k for s in ("flex","grid","overflow","fixed","sticky","screen","dvh","max-h","min-h","w-full","max-w","min-w")):
                  report.append(f"- {k}: {v}")
          report.append("")
          report.append("## Raw root/render context")
          for label,line,pos in markers:
              if label in {"createRoot","render-call","hydrateRoot"}:
                  lo=max(0,pos-700); hi=min(len(raw),pos+1800)
                  ctx=re.sub(r"\s+"," ",raw[lo:hi]).strip()
                  report.append(f"- {label} line {line}: {ctx}")
                  report.append("")

          (out/"UI_COMPONENT_INDEX.md").write_text("\n".join(report)+"\n",encoding="utf-8")
          print(f"components={len(fn_rows)} markers={len(markers)}")
          PY


      - name: Extract mobile redesign targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis_parts/mobile_targets
          python3 - <<'PY'
          from pathlib import Path
          import re
          raw=Path("Wayward_MOD_v2.107.html").read_text(encoding="utf-8")
          out=Path("analysis_parts/mobile_targets")
          targets=["nce","Ihe","vle","zse","The","She","whe"]
          for name in targets:
              m=re.search(r"\bfunction\s+"+re.escape(name)+r"\s*\([^)]*\)\s*\{",raw)
              if not m:
                  (out/f"{name}_MISSING.txt").write_text("missing\n",encoding="utf-8")
                  continue
              start=m.start()
              line=raw.count("\n",0,start)+1
              lo=max(0,start-1200)
              hi=min(len(raw),start+180000)
              ctx=raw[lo:hi]
              (out/f"{name}_CONTEXT.txt").write_text(f"source_line={line}\nstart_offset={start}\nchars={len(ctx)}\n\n"+ctx,encoding="utf-8")
          terms=["pointerdown","pointermove","pointerup","touchstart","touchmove","touchend","resize","drag","column","divider","map-pinned","wc2-toggle","portrait","movement","map","orientation","safe-area"]
          rows=[]
          for term in terms:
              count=0
              for m in re.finditer(re.escape(term),raw,re.I):
                  line=raw.count("\n",0,m.start())+1
                  lo=max(0,m.start()-700)
                  hi=min(len(raw),m.start()+1400)
                  rows.append((line,term,re.sub(r"\s+"," ",raw[lo:hi]).strip()))
                  count+=1
                  if count>=18:
                      break
          rows.sort()
          parts=["# Mobile interaction search contexts",""]
          for line,term,ctx in rows:
              parts += [f"## {term} | line {line}",ctx,""]
          (out/"SEARCH_CONTEXTS.md").write_text("\n".join(parts)+"\n",encoding="utf-8")
          styles=re.findall(r"<style\b[^>]*>(.*?)</style\s*>",raw,re.I|re.S)
          css="\n\n".join(styles)
          parts=["# Relevant CSS contexts",""]
          for pat in ["@media","desk:","100dvh","safe-area","mobile-flat","map-pinned"]:
              found=0
              for m in re.finditer(re.escape(pat),css,re.I):
                  lo=max(0,m.start()-500)
                  hi=min(len(css),m.start()+1200)
                  parts += [f"## {pat}",re.sub(r"\s+"," ",css[lo:hi]).strip(),""]
                  found+=1
                  if found>=20:
                      break
          (out/"CSS_CONTEXTS.md").write_text("\n".join(parts)+"\n",encoding="utf-8")
          PY


      - name: Extract mobile redesign target functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          src = Path("Wayward_MOD_v2.107.html")
          out = Path("analysis_parts")
          raw = src.read_text(encoding="utf-8")

          targets = ["nce","Ihe","vle","zse","The","She","whe","V5","z5","koHeaderButtons299","K5"]

          def find_function(name):
              m = re.search(r"\bfunction\s+" + re.escape(name) + r"\s*\([^)]*\)\s*\{", raw)
              if not m:
                  return None
              start = m.start()
              brace = raw.find("{", m.start(), m.end())
              i = brace
              depth = 0
              state = "code"
              esc = False
              while i < len(raw):
                  ch = raw[i]
                  nx = raw[i+1] if i + 1 < len(raw) else ""
                  if state == "line":
                      if ch == "\n":
                          state = "code"
                  elif state == "block":
                      if ch == "*" and nx == "/":
                          state = "code"
                          i += 1
                  elif state == "single":
                      if esc:
                          esc = False
                      elif ch == "\\":
                          esc = True
                      elif ch == "'":
                          state = "code"
                  elif state == "double":
                      if esc:
                          esc = False
                      elif ch == "\\":
                          esc = True
                      elif ch == '"':
                          state = "code"
                  elif state == "template":
                      if esc:
                          esc = False
                      elif ch == "\\":
                          esc = True
                      elif ch == chr(96):
                          state = "code"
                  else:
                      if ch == "/" and nx == "/":
                          state = "line"
                          i += 1
                      elif ch == "/" and nx == "*":
                          state = "block"
                          i += 1
                      elif ch == "'":
                          state = "single"
                      elif ch == '"':
                          state = "double"
                      elif ch == chr(96):
                          state = "template"
                      elif ch == "{":
                          depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              text = raw[start:end]
                              return {
                                  "name": name,
                                  "start_line": raw.count("\n",0,start)+1,
                                  "end_line": raw.count("\n",0,end)+1,
                                  "chars": len(text),
                                  "text": text
                              }
                  i += 1
              return None

          rows = []
          for name in targets:
              r = find_function(name)
              if r:
                  (out / ("TARGET_" + name + ".js.txt")).write_text(r["text"] + "\n", encoding="utf-8")
                  rows.append({k:r[k] for k in ("name","start_line","end_line","chars")})

          keywords = [
              "pointerdown","pointermove","pointerup","touchstart","touchmove","touchend",
              "map-pinned","wc2-toggle","desk:","100dvh","safe-area","overflow-y-auto",
              "orientation","innerWidth","matchMedia","resize"
          ]
          blocks = []
          seen = set()
          counts = {k:0 for k in keywords}
          for kw in keywords:
              for m in re.finditer(re.escape(kw), raw, re.I):
                  line = raw.count("\n",0,m.start()) + 1
                  key = (kw,line)
                  if key in seen or counts[kw] >= 25:
                      continue
                  seen.add(key)
                  lo = max(0,m.start()-1400)
                  hi = min(len(raw),m.end()+2200)
                  ctx = re.sub(r"\s+"," ",raw[lo:hi]).strip()
                  blocks.append("## " + kw + " | line " + str(line) + "\n" + ctx + "\n")
                  counts[kw] += 1

          (out/"MOBILE_INTERACTION_CONTEXTS.md").write_text(
              "# Mobile redesign interaction contexts\n\n" + "\n".join(blocks),
              encoding="utf-8"
          )
          (out/"TARGET_FUNCTION_INDEX.json").write_text(
              json.dumps(rows,ensure_ascii=False,indent=2),
              encoding="utf-8"
          )
          print(json.dumps(rows,ensure_ascii=False))
          PY

      - name: Generate compact mobile patch contexts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          raw = Path("Wayward_MOD_v2.107.html").read_text(encoding="utf-8")
          out = Path("analysis_parts/mobile_targets")
          out.mkdir(parents=True, exist_ok=True)

          def function_range(name):
              m = re.search(r"\bfunction\s+" + re.escape(name) + r"\s*\([^)]*\)\s*\{", raw)
              if not m:
                  return None
              brace = raw.find("{", m.start(), m.end())
              i, depth = brace, 0
              state, esc = "code", False
              while i < len(raw):
                  ch = raw[i]
                  nx = raw[i+1] if i + 1 < len(raw) else ""
                  if state == "line":
                      if ch == "\n": state = "code"
                  elif state == "block":
                      if ch == "*" and nx == "/": state = "code"; i += 1
                  elif state in ("single","double","template"):
                      if esc: esc = False
                      elif ch == "\\": esc = True
                      elif (state == "single" and ch == "'") or (state == "double" and ch == '"') or (state == "template" and ch == chr(96)):
                          state = "code"
                  else:
                      if ch == "/" and nx == "/": state = "line"; i += 1
                      elif ch == "/" and nx == "*": state = "block"; i += 1
                      elif ch == "'": state = "single"
                      elif ch == '"': state = "double"
                      elif ch == chr(96): state = "template"
                      elif ch == "{": depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0: return (m.start(), i + 1)
                  i += 1
              return None

          targets = {}
          for name in ["Ihe","vle","zse","The","She","whe"]:
              rr = function_range(name)
