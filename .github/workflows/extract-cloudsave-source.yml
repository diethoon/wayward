name: Extract CloudSave source for forensic inspection

on:
  push:
    branches:
      - work/cloudsave-auth-universal-20261113
    paths:
      - .github/workflows/extract-cloudsave-source.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract existing CloudSave archive without modifying it
        shell: bash
        run: |
          set -euo pipefail
          test -f Wayward_Google_Drive_CloudSave_v0.4.4_pre7.zip
          mkdir -p _cloudsave_inspect
          unzip -q -o Wayward_Google_Drive_CloudSave_v0.4.4_pre7.zip -d _cloudsave_inspect
          find _cloudsave_inspect -type f -printf '%p %s bytes\\n' | sort
          git add _cloudsave_inspect
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: expose CloudSave package source for inspection"
          git push origin HEAD:refs/heads/work/cloudsave-auth-universal-20261113
