name: CloudSave bridge source archive forensics

on:
  push:
    branches:
      - forensics/cloudsave-source-bridge-20261114

permissions:
  contents: read

jobs:
  inspect-cloudsave:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact CloudSave forensic branch
        uses: actions/checkout@v4
      - name: Compare archived package revisions and current module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile
          from io import BytesIO
          import hashlib

          archives = [
              Path("Wayward_Google_Drive_CloudSave_v0.4.4_pre7.zip"),
              Path("Wayward_Google_Drive_CloudSave_v0.5.0.zip"),
              Path("Wayward_Google_Drive_CloudSave_v0.5.1.zip"),
              Path("Wayward_Google_Drive_CloudSave_v0.5.2.zip"),
              Path("Wayward_Google_Drive_CloudSave_v0.6.0.zip"),
              Path("Wayward_Google_Drive_CloudSave_v0.6.1.zip"),
          ]
          terms = [
              "createAuthNonce", "function createAuthNonce", "const createAuthNonce",
              "let createAuthNonce", "var createAuthNonce", "nonceBytes",
              "crypto.getRandomValues", "window.open", "WMLHost",
              "startGoogleDriveAuth", "AUTH BRIDGE URL", "AUTH_PAGE_URL",
              "WML.define", "setup(api)"
          ]

          def scan_module(label, data):
              digest = hashlib.sha256()
              carry = b""
              hits = {term: [] for term in terms}
              chunks = 0
              for offset in range(0, len(data), 4096):
                  chunk = data[offset:offset+4096]
                  digest.update(chunk)
                  chunks += 1
                  probe = carry + chunk
                  base = offset - len(carry)
                  low = probe.lower()
                  for term in terms:
                      needle = term.encode("utf-8").lower()
                      start = 0
                      while True:
                          i = low.find(needle, start)
                          if i < 0:
                              break
                          pos = base + i
                          if pos >= 0 and pos not in hits[term]:
                              hits[term].append(pos)
                          start = i + 1
                  carry = probe[-96:]
              text = data.decode("utf-8", "replace")
              print(f"MODULE {label} bytes={len(data)} chunks={chunks} sha256={digest.hexdigest()}")
              print("  HEADER " + repr(text[:700]))
              for term in terms:
                  positions = hits[term]
                  if positions:
                      print(f"  {term!r} count={len(positions)} offsets={positions[:12]}")
                      if term in ("createAuthNonce", "nonceBytes", "crypto.getRandomValues", "WMLHost", "startGoogleDriveAuth", "AUTH BRIDGE URL", "AUTH_PAGE_URL"):
                          for pos in positions[:3]:
                              left=max(0,pos-300); right=min(len(text),pos+len(term)+520)
                              print("    " + repr(text[left:right]))
              declared = any(x in text for x in (
                  "function createAuthNonce", "const createAuthNonce",
                  "let createAuthNonce", "var createAuthNonce"
              ))
              print("  CHECK createAuthNonce_declared=" + str(declared) +
                    " occurrences=" + str(len(hits["createAuthNonce"])))

          def scan_zip(path):
              if not path.exists():
                  print(f"MISSING {path}")
                  return
              raw=path.read_bytes()
              print(f"ARCHIVE {path} bytes={len(raw)} sha256={hashlib.sha256(raw).hexdigest()}")
              try:
                  with ZipFile(BytesIO(raw)) as z:
                      for info in z.infolist():
                          if not info.is_dir() and info.filename.replace("\\","/").lower().endswith("cloud-save/mod.js"):
                              scan_module(str(path)+"!"+info.filename,z.read(info))
              except BadZipFile:
                  print(f"INVALID_ZIP {path}")

          for path in archives:
              scan_zip(path)

          direct = Path("cloud-save/mod.js")
          if direct.exists():
              scan_module(str(direct), direct.read_bytes())
          else:
              print("MISSING cloud-save/mod.js in branch")
          PY

  inspect-wml-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact WML archive snapshot
        uses: actions/checkout@v4
      - name: Scan WML core and enabled mod list in 4096-byte chunks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO
          import hashlib

          raw=Path("wayward 11.2.zip").read_bytes()
          with ZipFile(BytesIO(raw)) as z:
              names=[x.filename for x in z.infolist() if not x.is_dir()]
              core_path=next(p for p in names if p.endswith("/wml/runtime/wml-core.js"))
              mods_path=next(p for p in names if p.endswith("/wml/mods/mods.js"))
              cloud_paths=[p for p in names if "cloud-save" in p.lower() or "cloudsave" in p.lower()]
              print("CLOUD_SAVE_PATHS " + repr(cloud_paths))
              core=z.read(core_path)
              terms=[b"WML.define",b"WML.enable",b"define(",b"loadMod",b"loadScript",
                     b"mod.setup",b"setup(api)",b"setup.call",b"new Function",b"eval(",
                     b"createElement('script')",b'createElement("script")',b"script.src",
                     b"mods.js",b"mod.js",b"loadAfter",b"requires"]
              hashes=[]; found={}
              digest=hashlib.sha256(); tail=b""
              for offset in range(0,len(core),4096):
                  chunk=core[offset:offset+4096]
                  digest.update(chunk)
                  hashes.append(hashlib.sha256(chunk).hexdigest())
                  probe=tail+chunk; base=offset-len(tail); low=probe.lower()
                  for term in terms:
                      at=0
                      while True:
                          pos=low.find(term.lower(),at)
                          if pos<0:break
                          absolute=base+pos
                          if absolute>=0 and absolute not in found.setdefault(term.decode(),[]):found[term.decode()].append(absolute)
                          at=pos+1
                  tail=probe[-max(map(len,terms)):]
              text=core.decode("utf-8","replace")
              print(f"CORE {core_path} bytes={len(core)} chunks={len(hashes)} sha256={digest.hexdigest()}")
              for term,positions in found.items():
                  if not positions:continue
                  print(f"HIT {term!r} count={len(positions)} offsets={positions[:40]}")
                  for pos in positions[:4]:
                      left=max(0,pos-380);right=min(len(core),pos+len(term)+700)
                      print("  CONTEXT "+repr(text[left:right]))
              mods=z.read(mods_path)
              print(f"MODS {mods_path} bytes={len(mods)} sha256={hashlib.sha256(mods).hexdigest()}")
              print("MODS_JS "+repr(mods.decode("utf-8","replace")[:2200]))
              print("MODS_HAS_CLOUD_SAVE "+str(b'"cloud-save"' in mods or b"'cloud-save'" in mods))
          PY
