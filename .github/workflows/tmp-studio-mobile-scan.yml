name: tmp-studio-mobile-scan

on:
  workflow_dispatch:
  push:
    branches: [studio]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stream mobile UI targets
        shell: python
        run: |
          from pathlib import Path
          targets = {
            "src/main.js": [
              "function AOe(){",
              "function RPe(){",
              "function eOe(",
              "function rI(",
              "mobile-layout",
              "mobile-main-panel",
              "mobile-action-panel",
              "mobile-action-scroll",
              "현재 위치",
              "영업 준비",
              "물자 채우기",
              "물자채우기",
              "진행일",
            ],
            "game_style.css": [
              "mobile-layout",
              "mobile-main-panel",
              "mobile-action-panel",
              "mobile-action-scroll",
              "mobile-stock-up",
              "mobile-stock-target",
              "orientation: portrait",
              "orientation: landscape",
              "1023px",
            ]
          }
          for rel, needles in targets.items():
            p=Path(rel)
            if not p.exists():
              continue
            out=Path("studio_scan")/(rel.replace("/","_")+".txt")
            out.parent.mkdir(exist_ok=True)
            data_out=[]
            chunk_size=64*1024
            context=5000
            carry=b""
            offset=0
            seen=set()
            with p.open("rb") as f:
              while True:
                chunk=f.read(chunk_size)
                if not chunk: break
                data=carry+chunk
                base=offset-len(carry)
                text=data.decode("utf-8",errors="replace")
                for needle in needles:
                  start=0
                  while True:
                    i=text.find(needle,start)
                    if i<0: break
                    key=(needle,base+i)
                    if key not in seen:
                      l=max(0,i-context); r=min(len(text),i+len(needle)+context)
                      data_out.append((base+i,needle,text[l:r]))
                      seen.add(key)
                    start=i+len(needle)
                carry=data[-max(context*2,12000):]
                offset+=len(chunk)
            lines=[f"FILE={rel}",f"SIZE={p.stat().st_size}",f"HITS={len(data_out)}",""]
            for pos,needle,s in sorted(data_out):
              lines += [f"===== {needle} @ {pos} =====",s,""]
            out.write_text("\n".join(lines),encoding="utf-8")
      - name: Commit scan
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add studio_scan
          git commit -m "chore: temporary studio mobile scan" || exit 0
          git push