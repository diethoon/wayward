name: Forensic scan of WML hook runtime API

on:
  push:
    branches: [forensic/wml-hook-api-20261108]
    paths: [.github/workflows/forensic-wml-hook-api.yml]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan exact WML source in binary 4096-byte chunks
        run: |
          set -euo pipefail
          python3 scripts/scan_wml_hook_api.py
      - uses: actions/upload-artifact@v4
        with:
          name: wml-hook-api-contexts
          path: hook-api-contexts.zip
          if-no-files-found: error
