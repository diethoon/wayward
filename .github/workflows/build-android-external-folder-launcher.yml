name: Build Wayward external-folder Android launcher

on:
  push:
    branches: [feature/android-external-folder-launcher-v1, feature/android-external-folder-launcher-viewport-fit, feature/android-launcher-zip-mods-multi-sessions, feature/android-imagegen-launcher-one-tap, perf/launcher-saf-webview-20261109]
    paths:
      - "android-external-folder-launcher/**"
      - ".github/workflows/build-android-external-folder-launcher.yml"
  pull_request:
    paths:
      - "android-external-folder-launcher/**"
      - ".github/workflows/build-android-external-folder-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Embed pinned Wayward Image Studio backend
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="26d6c32e0b0abbb886e3029efd548b7ca6774401"
          git fetch --no-tags origin main
          git cat-file -e "${SOURCE_COMMIT}:mods.zip"
          git show "${SOURCE_COMMIT}:mods.zip" > "$RUNNER_TEMP/wayward-mods.zip"
          python3 android-external-folder-launcher/scripts/embed_imagegen_backend.py "$RUNNER_TEMP/wayward-mods.zip"
      - name: Extract pinned EasyGen source for runtime compatibility audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/wayward-mods.zip" "$RUNNER_TEMP/easygen-server-audit" <<'PY'
          import os, pathlib, sys, zipfile
          archive, output = map(pathlib.Path, sys.argv[1:])
          prefix = "wml/mods/easygen/"
          output.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as bundle:
              entries = [entry for entry in bundle.infolist()
                         if entry.filename.replace("\\\\", "/").startswith(prefix)
                         and not entry.is_dir()]
              launchers = [entry for entry in entries
                           if entry.filename.replace("\\\\", "/") == prefix + "server/launch.mjs"]
              print("EasyGen entries:", len(entries))
              print("EasyGen launcher found:", bool(launchers))
              for entry in entries:
                  name = entry.filename.replace("\\\\", "/")
                  relative = pathlib.PurePosixPath(name[len(prefix):])
                  if relative.is_absolute() or any(part in ("", ".", "..") for part in relative.parts):
                      raise SystemExit("Unsafe EasyGen archive path: " + name)
                  target = output.joinpath(*relative.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with bundle.open(entry) as source, target.open("wb") as destination:
                      remaining = entry.file_size
                      while remaining:
                          chunk = source.read(min(4096, remaining))
                          if not chunk:
                              raise SystemExit("Truncated EasyGen entry: " + name)
                          destination.write(chunk)
                          remaining -= len(chunk)
                  print("AUDIT_FILE", relative.as_posix(), entry.file_size)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure installed Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle 8.9
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo '/opt/gradle-8.9/bin' >> "$GITHUB_PATH"
      - name: Verify and build
        working-directory: android-external-folder-launcher
        run: bash ./verify.sh
      - name: Upload pinned EasyGen source audit bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EasyGen-runtime-source-audit
          path: ${{ runner.temp }}/easygen-server-audit
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: WaywardLauncher-image-diagnostics-v0.3.12
          path: android-external-folder-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
