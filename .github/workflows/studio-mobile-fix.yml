name: Studio mobile UI validation

on:
  push:
    branches: [studio]
    paths:
      - "src/main.js"
      - ".github/workflows/studio-mobile-fix.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate large source
        run: |
          set -euo pipefail
          node --check src/main.js
          git diff --check

      - name: Record validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis_parts
          python3 - <<'PY'
          from pathlib import Path
          raw=Path("src/main.js").read_text(encoding="utf-8")
          stock=raw[raw.find("function WaywardMobileStockButton("):raw.find("function WaywardPersistentStatus(")]
          status=raw[raw.find("function WaywardPersistentStatus("):raw.find("function WaywardCurrentActivity(")]
          report=[
            "# Studio mobile UI validation",
            "",
            "node --check src/main.js: PASS",
            "git diff --check: PASS",
            f"src/main.js characters: {len(raw)}",
            f"mobile stock component count: {raw.count('function WaywardMobileStockButton(')}",
            f"persistent status component count: {raw.count('function WaywardPersistentStatus(')}",
            f"stock target dispatch present: {'type:"set_supply_target"' in stock}",
            f"mobile stock hides when phase is not prep: {'e.phase!=="prep"||i===0' in stock}",
            f"hardcoded bedroom status removed: {'children:"침실"' not in status}",
          ]
          Path("analysis_parts/studio_mobile_ui_fix_report.md").write_text("\n".join(report),encoding="utf-8")
          PY

      - name: Commit validation report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_parts/studio_mobile_ui_fix_report.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record mobile UI validation"
          git push origin HEAD:studio
