name: Validate Studio mobile UI

on:
  push:
    branches: [studio]
    paths:
      - "src/main.js"
      - "game_style.css"
      - "index.html"
      - ".github/workflows/studio-mobile-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        run: node --check src/main.js

      - name: CSS structural syntax
        shell: python
        run: |
          from pathlib import Path

          css = Path("game_style.css").read_text(encoding="utf-8")
          depth = 0
          quote = None
          escape = False

          for i, ch in enumerate(css):
              if quote:
                  if escape:
                      escape = False
                  elif ch == "\\":
                      escape = True
                  elif ch == quote:
                      quote = None
                  continue
              if ch in ("'", '"'):
                  quote = ch
              elif ch == "{":
                  depth += 1
              elif ch == "}":
                  depth -= 1
                  if depth < 0:
                      raise SystemExit(f"Unmatched CSS closing brace at offset {i}")

          if quote:
              raise SystemExit("Unterminated CSS string")
          if depth != 0:
              raise SystemExit(f"Unbalanced CSS braces: depth={depth}")

          print(f"CSS structural check passed: {len(css):,} characters")
