name: Studio stock logic inspect
on:
  push:
    branches: [studio]
    paths:
      - "src/main.js"
      - ".github/workflows/studio-stock-inspect.yml"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract stock reducer context
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          raw=Path("src/main.js").read_text(encoding="utf-8")
          pats=["case"stock_up"","case 'stock_up'","type:"stock_up"","type:'stock_up'","prepStockUpDone","set_supply_target","supplyTargets"]
          out=[]
          for p in pats:
              out.append(f"===== {p} =====")
              pos=0
              for n in range(20):
                  i=raw.find(p,pos)
                  if i<0: break
                  out.append(f"--- {i} ---")
                  out.append(raw[max(0,i-7000):min(len(raw),i+14000)])
                  pos=i+len(p)
          Path("analysis_parts/studio_stock_logic_context.txt").write_text("\n".join(out),encoding="utf-8")
          PY
          node --check src/main.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_parts/studio_stock_logic_context.txt
          git commit -m "chore: extract stock logic context" || true
          git push origin HEAD:studio
