name: CloudSave connection runtime forensic
on:
  push:
    branches:
      - forensic/cloudsave-connection-runtime-20261119
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forensic/cloudsave-connection-runtime-20261119
      - name: Scan source in 4096-byte chunks
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, zipfile
          from pathlib import Path
          root=Path('.')
          target=root/'Wayward_WML_ko.html'
          data=target.read_bytes()
          patterns=[b'api.ui.window',b'ui.window',b'window(',b'alert(',b'confirm(',b'prompt(',b'connection',b'connected',b'handshake',b'WMLHost',b'gameRuntime',b'runtime',b'CloudSave', '연결'.encode(), '확인'.encode(), '게임'.encode()]
          records=[]
          for off in range(0,len(data),4096):
              chunk=data[off:off+4096]
              records.append({'offset':off,'length':len(chunk),'sha256':hashlib.sha256(chunk).hexdigest()})
          matches=[]
          low=data.lower()
          for p in patterns:
              q=p.lower()
              start=0
              while True:
                  i=low.find(q,start)
                  if i<0: break
                  matches.append({'pattern':p.decode('utf-8','replace'),'offset':i,'context':data[max(0,i-700):min(len(data),i+1400)].decode('utf-8','replace')})
                  start=i+1
          out={'path':str(target),'size':len(data),'sha256':hashlib.sha256(data).hexdigest(),'chunks':records,'matches':matches}
          Path('/tmp/wml-scan.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          import shutil\n          shutil.copy2(target, '/tmp/Wayward_WML_ko.html')\n          shutil.copy2(root/'Wayward_CloudSave_v0.6.2_INSTALL.zip', '/tmp/Wayward_CloudSave_v0.6.2_INSTALL.zip')\n          z=zipfile.ZipFile(root/'Wayward_CloudSave_v0.6.2_INSTALL.zip')
          z.extractall('/tmp/cloudsave')
          files=[]
          for p in Path('/tmp/cloudsave').rglob('*'):
              if p.is_file():
                  b=p.read_bytes()
                  files.append({'path':str(p),'size':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          Path('/tmp/cloudsave-files.json').write_text(json.dumps(files,indent=2))
          print(json.dumps({'size':len(data),'sha256':hashlib.sha256(data).hexdigest(),'chunks':len(records),'matches':len(matches),'files':files},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cloudsave-connection-runtime-forensic
          path: |
            /tmp/wml-scan.json
            /tmp/cloudsave-files.json
            /tmp/Wayward_WML_ko.html
            /tmp/Wayward_CloudSave_v0.6.2_INSTALL.zip
          if-no-files-found: error
