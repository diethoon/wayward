name: Extract current WML mod runtime evidence

on:
  push:
    branches:
      - forensic/cloudsave-mods-runtime-extract-20261119
    paths:
      - ".github/workflows/extract-current-wml-mods.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify and inventory current package sources
        shell: bash
        run: |
          set -euo pipefail
          test -s mods.zip
          test -s Wayward_WML_ko.html
          test -s Wayward_CloudSave_v0.6.2_INSTALL.zip
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          root = Path(".")
          def digest(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()
          p = root / "mods.zip"
          with zipfile.ZipFile(p) as z:
              entries = [{"path": x.filename, "size": x.file_size, "crc": f"{x.CRC:08x}"} for x in z.infolist()]
              relevant = [x for x in entries if any(k in x["path"].lower() for k in ("wml-core", "wml/runtime", "cloud-save", "cloudsave", "mods.js", "manifest"))]
              bad = z.testzip()
          report = {
              "commit": __import__("os").environ.get("GITHUB_SHA"),
              "mods_zip": {"path": str(p), "size": p.stat().st_size, "sha256": digest(p), "entries": len(entries), "testzip": bad, "relevant_entries": relevant},
              "game_html": {"path": "Wayward_WML_ko.html", "size": (root/"Wayward_WML_ko.html").stat().st_size, "sha256": digest(root/"Wayward_WML_ko.html")},
              "cloudsave_package": {"path": "Wayward_CloudSave_v0.6.2_INSTALL.zip", "size": (root/"Wayward_CloudSave_v0.6.2_INSTALL.zip").stat().st_size, "sha256": digest(root/"Wayward_CloudSave_v0.6.2_INSTALL.zip")}
          }
          Path("current-wml-package-inventory.json").write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if bad is not None:
              raise SystemExit(f"Corrupt mods.zip member: {bad}")
          PY
          mkdir -p forensic-package
          cp mods.zip Wayward_WML_ko.html Wayward_CloudSave_v0.6.2_INSTALL.zip current-wml-package-inventory.json forensic-package/
      - name: Upload exact current package sources
        uses: actions/upload-artifact@v4
        with:
          name: current-wml-package-sources
          path: forensic-package/
          if-no-files-found: error
          retention-days: 30
