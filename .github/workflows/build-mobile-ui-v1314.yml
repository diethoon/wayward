name: Build and validate mobile UI migration 1.3.14

on:
  push:
    branches:
      - fix/mobile-ui-prep-choice-layout-1.3.14
    paths:
      - "scripts/apply_mobile_ui_v1314.py.gz"
      - "scripts/test_mobile_ui_v1314_prep_migration.js.gz"
      - ".github/workflows/build-mobile-ui-v1314.yml"

permissions:
  contents: write

jobs:
  build-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore reproducible patch and integration test sources
        shell: bash
        run: |
          set -euo pipefail
          gzip -t scripts/apply_mobile_ui_v1314.py.gz
          gzip -dc scripts/apply_mobile_ui_v1314.py.gz > scripts/apply_mobile_ui_v1314.py
          gzip -t scripts/test_mobile_ui_v1314_prep_migration.js.gz
          gzip -dc scripts/test_mobile_ui_v1314_prep_migration.js.gz > scripts/test_mobile_ui_v1314_prep_migration.js
          python3 -m py_compile scripts/apply_mobile_ui_v1314.py
      - name: Verify exact WML source and v1.3.13 base package
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show 4babcaff70e65af6c804e126d8ff9af5eb19dc6a:Wayward_WML_ko.html > /tmp/Wayward_WML_ko.html
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('/tmp/Wayward_WML_ko.html')
          h=hashlib.sha256(); count=0; offset=0
          with p.open('rb') as f:
              while True:
                  b=f.read(4096)
                  if not b: break
                  h.update(b); count+=1; offset+=len(b)
          assert offset == 4373978, offset
          assert h.hexdigest() == 'e159fb2002d31559b1ac1936cf6b48cdbbdc4858bfbb0b67e2d7284ca2195d1d', h.hexdigest()
          print('SOURCE VERIFIED', offset, h.hexdigest(), 'chunks', count)
          PY
          git fetch --no-tags origin fix/mobile-ui-save-compat-1.3.13
          git show FETCH_HEAD:mobile-ui-migration-437-v1.3.13.zip > /tmp/mobile-ui-migration-437-v1.3.13.zip
          echo '61ccf0f6cbfe00a9f039e466e11f7d3b9ce81e916724002ffd1d8f3f9657bbc6  /tmp/mobile-ui-migration-437-v1.3.13.zip' | sha256sum -c -
      - name: Install isolated React test dependencies
        run: npm install --no-save --no-package-lock react@18.3.1 react-dom@18.3.1 jsdom@24.1.3
      - name: Apply minimal patch and run integration test
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_mobile_ui_v1314.py
          node --check mobile-ui-migration/mod.js
          node --check scripts/test_mobile_ui_v1314_prep_migration.js
          node scripts/test_mobile_ui_v1314_prep_migration.js
      - name: Commit generated module and package to the isolated feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add mobile-ui-migration/mod.js mobile-ui-migration/README_ko.md mobile-ui-migration-437-v1.3.14.zip
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: move prep and facility controls into mobile choices (v1.3.14)'
          git push origin HEAD:\${GITHUB_REF_NAME}
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-migration-437-v1.3.14
          path: mobile-ui-migration-437-v1.3.14.zip
          if-no-files-found: error
