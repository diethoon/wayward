name: mobile-customer-targeted
on:
  push:
    branches: [mobile-migration-v1]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Targeted forensic scan
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("src/main.js").read_text(encoding="utf-8")
          for needle in ["function ","S3(e)","return m.jsx(fp","w=!a&&!u","m.jsx(pb,{compact:!0,label:"]:
            print("\n###",needle)
            pos=0; n=0
            while True:
              i=s.find(needle,pos)
              if i<0 or n>=12: break
              print("OFFSET",i)
              print(s[max(0,i-5000):min(len(s),i+7000)])
              pos=i+1; n+=1
          PY
          node --check src/main.js
