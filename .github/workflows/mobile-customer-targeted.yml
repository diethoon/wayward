name: mobile-customer-targeted
on:
  push:
    branches: [mobile-migration-v1]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Targeted forensic scan
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("src/main.js").read_text(encoding="utf-8")
          for needle in ["function Y3","N5,{customer","m.jsx(N5","patrons:f","className:"+"group flex items-center gap-1.5"]:
            print("\n###",needle)
            pos=0; n=0
            while True:
              i=s.find(needle,pos)
              if i<0 or n>=10: break
              print("OFFSET",i)
              print(s[max(0,i-2200):min(len(s),i+6500)])
              pos=i+1; n+=1
          PY
          node --check src/main.js
