name: mobile-customer-targeted
on:
  push:
    branches: [mobile-migration-v1]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Targeted forensic scan
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=["Wayward_MOD_v2.107.html","src/main.js","game_style.css"]
          needles=["m36-mobile","m36-mobile-store-status-line","M36MobileRoomCustomer","wifeLoc","wifeRoomCount","인사하기","주문받기","서빙","take_order","greet","apologize_out_of_stock","throw_out_patron"]
          for fn in files:
            p=Path(fn); s=p.read_text(encoding="utf-8")
            print(f"\n===== FILE {fn} BYTES={p.stat().st_size} =====")
            for needle in needles:
              hits=[m.start() for m in re.finditer(re.escape(needle),s)]
              if hits:
                print(f"\n### {needle} HITS={len(hits)} OFFSETS={hits[:30]}")
                for i in hits[:10]:
                  print(f"--- OFFSET {i} ---")
                  print(s[max(0,i-1800):min(len(s),i+4200)])
          PY
          node --check src/main.js
