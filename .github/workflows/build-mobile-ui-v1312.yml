name: Build and validate mobile UI migration 1.3.12

on:
  push:
    branches:
      - fix/mobile-ui-save-compat-1.3.12
    paths:
      - ".github/workflows/build-mobile-ui-v1312.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact v1.3.10 base package
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin mobile-ui-port-20261101-v1.3.9
          git show FETCH_HEAD:mobile-ui-migration-437-v1.3.10.zip > /tmp/mobile-ui-v1310.zip
          echo "bb1b8d3d40eced0cdd563da6a98def4c70469ee3e80eb60ff8c0d6096bc49127  /tmp/mobile-ui-v1310.zip" | sha256sum -c -
          python3 scripts/build_mobile_ui_v1312.py
      - name: Validate exact WML target, source chunks and package
        shell: bash
        run: |
          set -euo pipefail
          node --check build/mobile-ui-migration/mod.js
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile

          src = Path("Wayward_WML_ko.html")
          chunks = []
          total = hashlib.sha256()
          offset = 0
          with src.open("rb") as f:
              while True:
                  block = f.read(4096)
                  if not block:
                      break
                  total.update(block)
                  chunks.append({
                      "offset": offset,
                      "length": len(block),
                      "sha256": hashlib.sha256(block).hexdigest()
                  })
                  offset += len(block)
          expected_size = 4373978
          expected_sha = "e159fb2002d31559b1ac1936cf6b48cdbbdc4858bfbb0b67e2d7284ca2195d1d"
          assert offset == expected_size, (offset, expected_size)
          assert total.hexdigest() == expected_sha, total.hexdigest()
          raw = src.read_bytes()
          assert b"function Voe(" in raw
          assert b"u.jsx(Voe,{limit:3})" in raw
          assert b"function Xrt(" in raw
          assert b"flex-1 min-h-0 overflow-y-auto p-2 text-[0.78rem]" in raw
          manifest = {
              "repository": "diethoon/wayward",
              "branch": "main",
              "commit": "4babcaff70e65af6c804e126d8ff9af5eb19dc6a",
              "path": str(src),
              "bytes": offset,
              "sha256": total.hexdigest(),
              "chunk_bytes": 4096,
              "chunks": chunks
          }
          Path("build/source-chunk-manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          mod = Path("build/mobile-ui-migration/mod.js").read_text(encoding="utf-8")
          assert 'typeName === "Voe"' in mod
          assert "originalWithoutChoices" in mod
          assert "mirrorChoices" not in mod
          out = Path("mobile-ui-migration-437-v1.3.12.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              z.writestr("mobile-ui-migration/", b"")
              z.write("build/mobile-ui-migration/mod.js", "mobile-ui-migration/mod.js")
              z.write("build/mobile-ui-migration/README_ko.md", "mobile-ui-migration/README_ko.md")
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              files = {x.filename: x.file_size for x in z.infolist()}
              assert set(files) == {
                  "mobile-ui-migration/",
                  "mobile-ui-migration/mod.js",
                  "mobile-ui-migration/README_ko.md"
              }, files
          print("SOURCE", offset, total.hexdigest(), "chunks", len(chunks))
          print("PACKAGE", out.stat().st_size, hashlib.sha256(out.read_bytes()).hexdigest())
          print("ZIP CONTENTS", files)
          PY
          git diff --check
      - name: Commit package to isolated fix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-ui-migration-437-v1.3.12.zip
          git commit -m "fix: remove duplicate patron choices and story alert (v1.3.12)"
          git push origin HEAD:fix/mobile-ui-save-compat-1.3.12
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-migration-437-v1.3.12
          path: mobile-ui-migration-437-v1.3.12.zip
          if-no-files-found: error
