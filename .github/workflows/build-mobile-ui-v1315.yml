name: Build and verify mobile UI migration 1.3.15

on:
  push:
    branches:
      - fix/mobile-ui-prep-choice-layout-1.3.15
    paths:
      - "scripts/build_mobile_ui_v1315.py"
      - "scripts/test_mobile_ui_v1315_layout.js"
      - ".github/workflows/build-mobile-ui-v1315.yml"

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact WML HTML baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show 4babcaff70e65af6c804e126d8ff9af5eb19dc6a:Wayward_WML_ko.html > /tmp/Wayward_WML_ko.html
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('/tmp/Wayward_WML_ko.html')
          h=hashlib.sha256(); count=0; offset=0
          with p.open('rb') as f:
              while True:
                  b=f.read(4096)
                  if not b: break
                  h.update(b); count+=1; offset+=len(b)
          assert offset == 4373978, offset
          assert h.hexdigest() == 'e159fb2002d31559b1ac1936cf6b48cdbbdc4858bfbb0b67e2d7284ca2195d1d', h.hexdigest()
          print('SOURCE VERIFIED', offset, h.hexdigest(), 'chunks', count)
          PY
      - name: Install isolated React integration test dependencies
        run: npm install --no-save --no-package-lock react@18.3.1 react-dom@18.3.1 jsdom@24.1.3
      - name: Build v1.3.15 package from the reviewed v1.3.14 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build_mobile_ui_v1315.py
          python3 scripts/build_mobile_ui_v1315.py
          node --check mobile-ui-migration/mod.js
          node --check scripts/test_mobile_ui_v1315_layout.js
      - name: Test exact gat-shaped React tree and action dispatch
        run: node scripts/test_mobile_ui_v1315_layout.js
      - name: Commit verified module and ZIP
        shell: bash
        run: |
          set -euo pipefail
          git add mobile-ui-migration/mod.js mobile-ui-migration/README_ko.md mobile-ui-migration-437-v1.3.15.zip
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'fix: detect mobile WML viewport before moving prep panel (v1.3.15)'
            git push origin HEAD:fix/mobile-ui-prep-choice-layout-1.3.15
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-migration-437-v1.3.15
          path: mobile-ui-migration-437-v1.3.15.zip
          if-no-files-found: error
