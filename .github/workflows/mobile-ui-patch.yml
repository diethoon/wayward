name: Apply mobile UI patch

on:
  push:
    branches: [mobile-redesign-v1]
    paths:
      - "Wayward_MOD_v2.107.html"
      - ".github/workflows/mobile-ui-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: !contains(github.event.head_commit.message, 'chore: apply mobile debug toggle patch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch debug toggle and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          src = Path("Wayward_MOD_v2.107.html")
          raw = src.read_text(encoding="utf-8")
          marker = 'id="mobile-redesign-debug-toggle-v1"'

          if marker in raw:
              raise SystemExit("Patch already present")

          style = '''
          <style id="mobile-redesign-debug-toggle-v1">
          @media (max-width: 1023px) {
            #wc2-toggle {
              left: auto !important;
              right: calc(12px + env(safe-area-inset-right)) !important;
              bottom: calc(12px + env(safe-area-inset-bottom)) !important;
              opacity: 0.18 !important;
              z-index: 40 !important;
            }
            #wc2-toggle:active,
            #wc2-toggle:focus-visible {
              opacity: 0.92 !important;
            }
          }
          </style>
          '''

          if "</head>" not in raw.lower():
              raise SystemExit("Missing </head> anchor")

          new_raw = re.sub(r"</head>", style + "\n</head>", raw, count=1, flags=re.I)
          if new_raw == raw:
              raise SystemExit("No source change produced")

          if new_raw.count(marker) != 1:
              raise SystemExit("Unexpected marker count")

          src.write_text(new_raw, encoding="utf-8")

          scripts = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", new_raw, flags=re.I | re.S)
          checked = 0
          for i, code in enumerate(scripts, 1):
              if not code.strip():
                  continue
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", delete=False) as f:
                  f.write(code)
                  p = f.name
              try:
                  subprocess.run(["node", "--check", p], check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
              except subprocess.CalledProcessError as e:
                  print(e.stderr)
                  raise SystemExit(f"node --check failed for inline script {i}")
              finally:
                  Path(p).unlink(missing_ok=True)
              checked += 1

          before = raw
          after = new_raw
          without_style = after.replace(style, "", 1)
          if without_style != before:
              raise SystemExit("Diff guard failed: change exceeds the intended style insertion")

          print(f"VALIDATION_OK inline_scripts={checked}")
          print(f"SIZE chars={len(new_raw)} bytes={len(new_raw.encode('utf-8'))}")
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wayward_MOD_v2.107.html
          git commit -m "chore: apply mobile debug toggle patch"
          git push

# retrigger
