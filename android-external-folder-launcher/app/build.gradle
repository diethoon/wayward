plugins { id 'com.android.application' }
android {
    namespace 'com.wayward.launcher'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.wayward.launcher'
        minSdk 29
        targetSdk 35
        versionCode 18
        versionName '0.3.13'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { applicationIdSuffix '.imagegen0313'; versionNameSuffix '-bun-exec-fix' }
        release { minifyEnabled false }
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
