<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://accounts.google.com/gsi/client; connect-src https://accounts.google.com/gsi/ https://oauth2.googleapis.com; frame-src https://accounts.google.com/gsi/; style-src 'unsafe-inline' https://accounts.google.com/gsi/style; base-uri 'none'; object-src 'none'; form-action 'none'">
<title>Wayward CloudSave · Google 인증</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#111827;color:#f3f4f6}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px}
main{width:min(100%,460px);padding:26px;border:1px solid #374151;border-radius:18px;background:#1f2937;box-shadow:0 18px 60px #0006}
h1{font-size:1.35rem;margin:0 0 12px}
p{line-height:1.55;color:#d1d5db}
#status{padding:14px;border-radius:10px;background:#111827;overflow-wrap:anywhere}
button{width:100%;min-height:48px;padding:12px 16px;border:0;border-radius:9px;background:#4285f4;color:#fff;font:600 1rem system-ui;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
small{color:#9ca3af}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<main>
<h1>Wayward CloudSave Google 인증</h1>
<p id="status" role="status" aria-live="polite">Google 인증 라이브러리를 불러오고 있습니다.</p>
<button id="login" type="button" disabled>Google 계정으로 연결</button>
<p><small>인증은 이 GitHub Pages에서 Google로 직접 요청합니다. 세이브 파일과 액세스 토큰은 이 페이지의 서버로 전송되거나 저장되지 않습니다.</small></p>
</main>
<script>
(() => {
'use strict';
const CLIENT_ID='35944231952-p82giir62o28bo001j9uvmqo3kgp9c99.apps.googleusercontent.com';
const DRIVE_SCOPE='https://www.googleapis.com/auth/drive.appdata';
const params=new URLSearchParams(location.search);
const mode=params.get('mode')||'login';
const nonce=params.get('nonce')||'';
const gameOrigin=params.get('origin')||'';
const loginPolicy=params.get('login')==='select_account'?'select_account':'remember';
const statusNode=document.getElementById('status');
const loginButton=document.getElementById('login');
const LEGACY_CENTRAL_KEY='wayward-cloud-auth-session-v1';
function status(message){statusNode.textContent=String(message||'');}
try{localStorage.removeItem(LEGACY_CENTRAL_KEY);}catch(_){}
function validGameOrigin(value){
 if(!/^https?:\/\//.test(value))return false;
 try{
  const parsed=new URL(value);
  return (parsed.protocol==='http:'||parsed.protocol==='https:')&&
   parsed.origin===value&&!parsed.username&&!parsed.password;
 }catch(_){return false;}
}
function parentIsVerified(){
 if(!window.opener||window.opener.closed)return false;
 if(!/^[a-f0-9]{48}$/.test(nonce)||!validGameOrigin(gameOrigin))return false;
 let referrerOrigin='';
 try{referrerOrigin=document.referrer?new URL(document.referrer).origin:'';}catch(_){}
 // The caller-supplied origin is not trusted by itself. Require the browser's
 // actual cross-origin Referer origin to match it before any token handoff.
 return !!referrerOrigin&&referrerOrigin===gameOrigin;
}
function postToParent(payload){
 try{
  if(!parentIsVerified())return false;
  window.opener.postMessage(payload,gameOrigin);
  return true;
 }catch(_){return false;}
}
function closeSoon(){setTimeout(()=>{try{window.close();}catch(_){}},900);}
function readyGIS(){return !!(window.google&&google.accounts&&google.accounts.oauth2);}
function waitForGIS(deadline){
 return new Promise((resolve,reject)=>{
  const check=()=>{
   if(readyGIS()){resolve();return;}
   if(Date.now()>=deadline){reject(new Error('Google Identity 라이브러리를 불러오지 못했습니다.'));return;}
   setTimeout(check,75);
  };
  check();
 });
}
function beginLogin(){
 if(!parentIsVerified()){
  status('인증 요청의 출처를 확인할 수 없습니다. 게임 안의 Google 연결 버튼에서 다시 여세요. file:// 직접 실행은 보안상 지원하지 않습니다.');
  loginButton.disabled=true;
  return;
 }
 if(!readyGIS()){
  status('Google 인증 라이브러리를 아직 불러오지 못했습니다. 잠시 후 다시 시도하세요.');
  return;
 }
 loginButton.disabled=true;
 status('Google 계정 선택 및 Drive 앱 데이터 접근 권한을 요청합니다.');
 try{
  const client=google.accounts.oauth2.initTokenClient({
   client_id:CLIENT_ID,
   scope:DRIVE_SCOPE,
   include_granted_scopes:true,
   callback:response=>{
    if(!response||response.error||!response.access_token){
     const reason=response&&response.error_description||response&&response.error||'Google 액세스 토큰을 받지 못했습니다.';
     postToParent({type:'wayward-cloud-auth-error',nonce,code:String(response&&response.error||''),message:String(reason)});
     status('Google 인증 실패: '+String(reason));
     loginButton.disabled=false;
     return;
    }
    if(response.state&&response.state!==nonce){
     postToParent({type:'wayward-cloud-auth-error',nonce,message:'Google 인증 state가 일치하지 않습니다.'});
     status('인증 응답 state 검증에 실패했습니다.');
     loginButton.disabled=false;
     return;
    }
    if(!google.accounts.oauth2.hasGrantedAllScopes(response,DRIVE_SCOPE)){
     postToParent({
      type:'wayward-cloud-auth-error',
      nonce,
      code:'scope_missing',
      message:'Google Drive 앱 데이터(appDataFolder) 접근 권한이 승인되지 않았습니다.'
     });
     status('Drive 저장 권한이 승인되지 않아 연결하지 않았습니다. 권한을 허용한 뒤 다시 연결하세요.');
     loginButton.disabled=false;
     return;
    }
    const delivered=postToParent({
     type:'wayward-cloud-auth-success',
     nonce,
     accessToken:response.access_token,
     expiresIn:Number(response.expires_in)||3600
    });
    if(!delivered){
     status('Google 인증은 완료했지만 게임의 요청 출처를 확인하지 못해 토큰을 전달하지 않았습니다.');
     loginButton.disabled=false;
     return;
    }
    status('Google 인증이 완료되었습니다. 게임으로 돌아가세요.');
    loginButton.disabled=true;
    closeSoon();
   },
   error_callback:error=>{
    const reason=error&&error.type||'Google 인증 팝업을 시작하지 못했습니다.';
    postToParent({type:'wayward-cloud-auth-error',nonce,code:String(error&&error.type||''),message:String(reason)});
    status('Google 인증을 시작하지 못했습니다: '+String(reason));
    loginButton.disabled=false;
   }
  });
  // Keep this call directly in the click handler: Google requires a user gesture.
  client.requestAccessToken({prompt:loginPolicy==='select_account'?'select_account':'',state:nonce});
 }catch(error){
  const reason=String(error&&error.message||error);
  postToParent({type:'wayward-cloud-auth-error',nonce,code:'request_failed',message:reason});
  status('Google 인증을 시작하지 못했습니다: '+reason);
  loginButton.disabled=false;
 }
}
function beginRevoke(){
 if(!parentIsVerified()){
  status('로그아웃 요청의 출처를 확인할 수 없습니다. 게임에서 다시 시도하세요.');
  return;
 }
 window.addEventListener('message',event=>{
  if(event.source!==window.opener||event.origin!==gameOrigin||!event.data||
     event.data.type!=='wayward-cloud-revoke'||event.data.nonce!==nonce)return;
  const token=event.data.accessToken;
  if(typeof token!=='string'||!token||token.length>4096){
   postToParent({type:'wayward-cloud-revoke-result',nonce,revoked:false,error:'invalid_token'});
   status('철회할 토큰이 유효하지 않습니다.');
   return;
  }
  try{
   google.accounts.oauth2.revoke(token,response=>{
    const revoked=!!(response&&response.successful===true);
    postToParent({
     type:'wayward-cloud-revoke-result',
     nonce,
     revoked,
     error:response&&response.error||''
    });
    status(revoked?'Google 앱 권한을 철회했습니다.':'Google 권한 철회에 실패했습니다: '+String(response&&response.error||'unknown'));
    closeSoon();
   });
  }catch(error){
   const reason=String(error&&error.message||error);
   postToParent({type:'wayward-cloud-revoke-result',nonce,revoked:false,error:reason});
   status('Google 권한 철회 실패: '+reason);
  }
 });
 if(!postToParent({type:'wayward-cloud-revoke-ready',nonce})){
  status('게임으로 안전한 로그아웃 응답 채널을 만들 수 없습니다.');
  return;
 }
 status('Google 권한 철회 요청을 기다리고 있습니다.');
}
waitForGIS(Date.now()+15000).then(()=>{
 if(mode==='revoke'){beginRevoke();return;}
 loginButton.disabled=false;
 loginButton.textContent=loginPolicy==='select_account'?'Google 계정 선택':'기존 Google 계정으로 다시 연결';
 status(loginPolicy==='select_account'
  ? '명시적 로그아웃 또는 새로고침 로그인 해제 설정에 따라 계정 선택 화면을 표시합니다.'
  : '기존 Google 계정의 로그인 및 승인 상태를 재사용하도록 시도합니다. 이 요청은 사용자 동작이 필요합니다.');
 loginButton.addEventListener('click',beginLogin);
}).catch(error=>{
 status(String(error&&error.message||error));
 loginButton.disabled=true;
});
})();
</script>
</body>
</html>
